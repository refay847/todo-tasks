name: tasks
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Launcher icon (the one on the home screen)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#272F3C"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  remove_alpha_ios: true

# Splash screen (shown while the app is loading)
flutter_native_splash:
  color: "#272F3C"
  image: assets/logo/splash_logo.png
  android_12:
    color: "#272F3C"
    image: assets/logo/splash_logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/logo/